name: Engine CI

on:
  push:
  pull_request:

concurrency:
  group: engine-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Documentation-link tests validate files in this repository's docs
          # submodule, which must be present in CI just as it is locally.
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo test -p kalcite-cli --test documentation
      - run: cargo run -p kalcite-cli -- test tests/klc
      - run: cargo check --workspace
      - run: cargo clippy --workspace --all-targets
